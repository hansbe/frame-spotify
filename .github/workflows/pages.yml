name: Publiser til GitHub Pages

# Kjører ved hver endring, f.eks. når du laster opp et nytt bilde til art/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Lag liste over egne bilder (art/art.json)
        run: |
          python3 - <<'EOF'
          import json, os
          exts = ('.jpg', '.jpeg', '.png', '.webp', '.gif', '.avif')
          files = sorted(f for f in os.listdir('art') if f.lower().endswith(exts) and not f.startswith('.'))
          with open('art/art.json', 'w', encoding='utf-8') as fh:
              json.dump(files, fh, ensure_ascii=False, indent=1)
          print(f'{len(files)} bilder')
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
